{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% block title %}Panel Administrativo — Rebooy Panel{% endblock %}</title>

    <!-- Metadatos SEO y del Sistema -->
    <meta name="description" content="{% block meta_description %}Panel central de control, automatización y gestión para Rebooy Studio.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}rebooy, rebooy panel, automation studio, creator studio, instagram downloader, fanpage studio{% endblock %}">
    <meta name="author" content="Rebooy">
    <meta name="robots" content="{% block meta_robots %}noindex, nofollow{% endblock %}">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark">

    <!-- Open Graph / Redes Sociales -->
    <meta property="og:site_name" content="Rebooy Panel">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Rebooy Panel — Sistema Central{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Panel central de control, automatización y gestión para Rebooy Studio.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{% if request %}{{ request.build_absolute_uri }}{% endif %}{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{% if request %}{{ request.scheme }}://{{ request.get_host }}{% endif %}{% static 'img/id.jpg' %}{% endblock %}">
    <meta property="og:image:alt" content="Rebooy Creator Identity">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Rebooy Panel — Sistema Central{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Panel central de control, automatización y gestión para Rebooy Studio.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{% if request %}{{ request.scheme }}://{{ request.get_host }}{% endif %}{% static 'img/id.jpg' %}{% endblock %}">

    {% block extra_meta %}{% endblock %}

    <!-- Favicon & Brand Identity -->
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/id.jpg' %}">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            900: '#7f1d1d',
                            950: '#450a0a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glass-panel-dark {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    {% block content %}
    {% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
